<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>实习 Show · 管理后台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           background: #f5f6fa; color: #1f2329; }
    header { background: linear-gradient(135deg, #6a5acd, #8a7cf0); color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; opacity: .85; font-size: 13px; }
    .wrap { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tabs button { border: none; background: #fff; padding: 8px 16px; border-radius: 20px;
                   cursor: pointer; font-size: 14px; color: #555; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .tabs button.active { background: #6a5acd; color: #fff; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .card .top { display: flex; justify-content: space-between; align-items: center; }
    .card .company { font-weight: 600; font-size: 16px; }
    .card .meta { color: #888; font-size: 12px; margin-top: 2px; }
    .scores { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .scores span { background: #f0f1f8; border-radius: 6px; padding: 3px 8px; font-size: 12px; }
    .stamps { margin-bottom: 8px; }
    .stamp { display: inline-block; background: #fff3e0; color: #d2691e; border: 1px solid #ffd8a8;
             border-radius: 6px; padding: 2px 8px; font-size: 12px; margin-right: 6px; }
    .content { font-size: 14px; line-height: 1.6; color: #333; margin: 8px 0; white-space: pre-wrap; }
    .reason-input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 8px;
                    font-size: 13px; margin: 8px 0; resize: vertical; }
    .actions { display: flex; gap: 10px; }
    .actions button { border: none; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px; }
    .approve { background: #07c160; color: #fff; }
    .reject { background: #fa5151; color: #fff; }
    .status-tag { font-size: 12px; padding: 2px 10px; border-radius: 12px; }
    .s0 { background: #fff7e6; color: #d48806; }
    .s1 { background: #f6ffed; color: #389e0d; }
    .s2 { background: #fff1f0; color: #cf1322; }
    .empty { text-align: center; color: #999; padding: 40px; }
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
             background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px;
             opacity: 0; transition: opacity .3s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>实习 Show · 管理后台</h1>
    <p>审核用户提交的点评（通过 / 拒绝）。后端：FastAPI + SQLAlchemy。</p>
  </header>
  <div class="wrap">
    <div class="tabs">
      <button data-status="0" class="active">待审核</button>
      <button data-status="1">已通过</button>
      <button data-status="2">已拒绝</button>
      <button data-status="">全部</button>
    </div>
    <div id="list"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const BASE = "http://localhost:5000";
    let currentStatus = 0;

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1600);
    }

    function stampClass() { return "stamp"; }

    function render(list) {
      const box = document.getElementById("list");
      if (!list.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
      box.innerHTML = list.map(r => {
        const scores = Object.entries(r.scores || {})
          .map(([k, v]) => `<span>${k}: ${v}</span>`).join("");
        const stamps = (r.stamps || []).map(s => `<span class="${stampClass()}">${s}</span>`).join("");
        const statusText = { 0: "审核中", 1: "通过", 2: "拒绝" }[r.status];
        const reason = r.status === 2 && r.auditReason
          ? `<div class="meta">拒绝理由：${r.auditReason}</div>` : "";
        const actions = r.status === 0 ? `
          <div class="reason-input-wrap">
            <textarea class="reason-input" id="reason-${r.id}" placeholder="拒绝理由（可选）"></textarea>
          </div>
          <div class="actions">
            <button class="approve" onclick="audit(${r.id},'approve')">通过</button>
            <button class="reject" onclick="audit(${r.id},'reject')">拒绝</button>
          </div>` : "";
        return `
          <div class="card">
            <div class="top">
              <div>
                <div class="company">${r.companyName}</div>
                <div class="meta">${r.dept} · ${r.role} · ${r.createdAt}</div>
              </div>
              <span class="status-tag s${r.status}">${statusText}</span>
            </div>
            <div class="scores">${scores}</div>
            <div class="stamps">${stamps}</div>
            <div class="content">${r.content}</div>
            ${reason}
            ${actions}
          </div>`;
      }).join("");
    }

    async function load() {
      const url = `${BASE}/api/admin/reviews` +
        (currentStatus === "" ? "" : `?status=${currentStatus}`);
      try {
        const res = await fetch(url);
        const data = await res.json();
        render(data);
      } catch (e) {
        toast("加载失败，请确认后端已启动");
      }
    }

    async function audit(id, action) {
      const reason = document.getElementById(`reason-${id}`)?.value || "";
      const res = await fetch(`${BASE}/api/admin/reviews/${id}/audit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, reason, adminId: "admin" }),
      });
      if (res.ok) { toast(action === "approve" ? "已通过" : "已拒绝"); load(); }
      else { const d = await res.json().catch(() => ({})); toast(d.detail || "操作失败"); }
    }

    document.querySelectorAll(".tabs button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentStatus = btn.dataset.status === "" ? "" : Number(btn.dataset.status);
        load();
      };
    });

    load();
  </script>
</body>
</html>
