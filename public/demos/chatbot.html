<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能客服 · Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:radial-gradient(1200px 600px at 80% -10%,#0891b233,transparent),#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .glass{background:rgba(30,41,59,.6);border:1px solid rgba(148,163,184,.18)}
  .chip{background:rgba(45,212,191,.12);color:#5eead4;border:1px solid rgba(45,212,191,.25)}
  .bub-u{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3)}
  .bub-b{background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.25)}
</style>
</head>
<body class="text-slate-200 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-teal-400 to-sky-400 bg-clip-text text-transparent">智能客服</h1>
      <p class="text-slate-400 text-sm mt-1">意图路由(Skill) + 工具调用(MCP) + 知识库(RAG)</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="status" class="text-xs px-3 py-1 rounded-full chip">连接中…</span>
      <a href="index.html" class="text-xs text-slate-400 hover:text-sky-400">← 全部 Demo</a>
    </div>
  </header>

  <section class="glass rounded-2xl p-6">
    <div id="chat" class="h-80 overflow-y-auto space-y-3 mb-3 p-2"></div>
    <div class="flex gap-2">
      <input id="msg" class="flex-1 bg-slate-900/70 border border-slate-700 rounded-lg p-3 text-sm" placeholder="试试：查订单 ORDER12345 / 我要退款 ORDER9999 / 你们支持哪些模型 / 转人工" />
      <button id="sendBtn" class="px-5 py-2 rounded-lg bg-teal-500 hover:bg-teal-400 text-white text-sm font-medium">发送</button>
    </div>
    <p class="text-xs text-slate-500 mt-3">提示词意图：<span id="intents" class="text-teal-300"></span></p>
  </section>
</div>

<script>
const API = "http://localhost:8011";
function setStatus(){ fetch(API+"/api/chatbot/health").then(r=>r.json()).then(d=>{
  document.getElementById("status").textContent = d.llm_enabled ? "● 真实模型" : "● 规则降级";
  document.getElementById("intents").textContent = d.faq_chunks ? "查订单 / 退款 / 转人工 / 产品咨询" : "";
}).catch(()=> document.getElementById("status").textContent="● 未连接"); }
setStatus();

function addBubble(role, html){
  const box = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "p-3 rounded-xl text-sm max-w-[88%] " + (role==="user"?"bub-u ml-auto":"bub-b");
  d.innerHTML = html;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
document.getElementById("sendBtn").onclick = async ()=>{
  const m = document.getElementById("msg").value; if(!m) return;
  addBubble("user", m); document.getElementById("msg").value="";
  const r = await fetch(API+"/api/chatbot/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m, session_id:"demo"})}).then(x=>x.json());
  const tools = r.tool_calls.map(t=>`<div class="text-[10px] mt-1 text-teal-300">⚙ MCP: ${t.tool} → ${t.result}</div>`).join("");
  addBubble("bot", `<div>意图: <b class="text-teal-300">${r.intent||"无"}</b></div><div class="mt-1">${r.reply}</div>${tools}`);
};
</script>
</body>
</html>
