<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多模态对话机器人 · Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:radial-gradient(1200px 600px at 50% -10%,#db277733,transparent),#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .glass{background:rgba(30,41,59,.6);border:1px solid rgba(148,163,184,.18)}
  .chip{background:rgba(244,114,182,.12);color:#f9a8d4;border:1px solid rgba(244,114,182,.25)}
  .bubble-user{background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3)}
  .bubble-bot{background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.25)}
</style>
</head>
<body class="text-slate-200 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-pink-400 to-sky-400 bg-clip-text text-transparent">多模态对话机器人</h1>
      <p class="text-slate-400 text-sm mt-1">文本情感感知 · 图像理解 · 语音转录</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="status" class="text-xs px-3 py-1 rounded-full chip">连接中…</span>
      <a href="index.html" class="text-xs text-slate-400 hover:text-sky-400">← 全部 Demo</a>
    </div>
  </header>

  <section class="glass rounded-2xl p-6 mb-6">
    <h2 class="text-lg font-semibold mb-3">① 对话（自动感知情绪）</h2>
    <div id="chat" class="h-64 overflow-y-auto space-y-3 mb-3 p-2"></div>
    <div class="flex gap-2">
      <input id="msg" class="flex-1 bg-slate-900/70 border border-slate-700 rounded-lg p-3 text-sm" placeholder="说点什么…（试试带情绪的句子）" />
      <button id="sendBtn" class="px-5 py-2 rounded-lg bg-pink-500 hover:bg-pink-400 text-white text-sm font-medium">发送</button>
    </div>
  </section>

  <div class="grid md:grid-cols-2 gap-6">
    <section class="glass rounded-2xl p-6">
      <h2 class="text-lg font-semibold mb-3">② 图像理解</h2>
      <input id="caption" class="w-full bg-slate-900/70 border border-slate-700 rounded-lg p-3 text-sm mb-3" placeholder="用文字描述图片，如：户外草地上有一只猫" />
      <button id="imgBtn" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm">分析图像</button>
      <div id="imgOut" class="mt-3 text-xs text-slate-300 whitespace-pre-wrap"></div>
    </section>

    <section class="glass rounded-2xl p-6">
      <h2 class="text-lg font-semibold mb-3">③ 语音转录</h2>
      <input id="voiceText" class="w-full bg-slate-900/70 border border-slate-700 rounded-lg p-3 text-sm mb-3" placeholder="已识别文本（留空则模拟）" />
      <button id="voiceBtn" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm">转录并感知情绪</button>
      <div id="voiceOut" class="mt-3 text-xs text-slate-300 whitespace-pre-wrap"></div>
    </section>
  </div>
</div>

<script>
const API = "http://localhost:8011";
function setStatus(){ fetch(API+"/api/multimodal/health").then(r=>r.json()).then(d=>{
  document.getElementById("status").textContent = d.llm_enabled ? "● 真实模型" : "● 规则降级";
}).catch(()=> document.getElementById("status").textContent="● 未连接"); }
setStatus();

const emoColor = { positive:"#34d399", negative:"#f87171", neutral:"#94a3b8" };
function addBubble(role, text, emotion){
  const box = document.getElementById("chat");
  const d = document.createElement("div");
  d.className = "p-3 rounded-xl text-sm max-w-[85%] " + (role==="user"?"bubble-user ml-auto":"bubble-bot");
  d.innerHTML = text + (emotion?`<div class="text-[10px] mt-1" style="color:${emoColor[emotion]||'#94a3b8'}">情绪: ${emotion}</div>`:"");
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
document.getElementById("sendBtn").onclick = async ()=>{
  const m = document.getElementById("msg").value; if(!m) return;
  addBubble("user", m); document.getElementById("msg").value="";
  const r = await fetch(API+"/api/multimodal/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m, session_id:"demo", mode:"text"})}).then(x=>x.json());
  addBubble("bot", r.reply, r.emotion);
};
document.getElementById("imgBtn").onclick = async ()=>{
  const r = await fetch(API+"/api/multimodal/analyze-image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({caption:document.getElementById("caption").value, session_id:"demo"})}).then(x=>x.json());
  document.getElementById("imgOut").textContent = `场景: ${r.scene}\n识别物体: ${r.objects.join(", ")}\n建议回复: ${r.suggestion}\n(vision_enabled=${r.vision_enabled})`;
};
document.getElementById("voiceBtn").onclick = async ()=>{
  const t = document.getElementById("voiceText").value;
  const r = await fetch(API+"/api/multimodal/transcribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({transcript:t||null, session_id:"demo"})}).then(x=>x.json());
  document.getElementById("voiceOut").textContent = `转录: ${r.transcript}\n情绪: ${r.emotion} (${r.emotion_score})\n${r.note}`;
};
</script>
</body>
</html>
