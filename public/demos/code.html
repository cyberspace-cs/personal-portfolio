<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 代码助手 · Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:radial-gradient(1200px 600px at 20% -10%,#7c3aed33,transparent),#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .glass{background:rgba(30,41,59,.6);border:1px solid rgba(148,163,184,.18)}
  .chip{background:rgba(167,139,250,.12);color:#c4b5fd;border:1px solid rgba(167,139,250,.25)}
  .tab.active{background:#7c3aed;color:#fff}
</style>
</head>
<body class="text-slate-200 min-h-screen">
<div class="max-w-4xl mx-auto px-4 py-8">
  <header class="flex items-center justify-between mb-8">
    <div>
      <h1 class="text-3xl font-bold bg-gradient-to-r from-violet-400 to-sky-400 bg-clip-text text-transparent">AI 代码助手</h1>
      <p class="text-slate-400 text-sm mt-1">生成 / 补全 / 重构 / 解释 · Skill 路由 + MCP 工具</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="status" class="text-xs px-3 py-1 rounded-full chip">连接中…</span>
      <a href="index.html" class="text-xs text-slate-400 hover:text-sky-400">← 全部 Demo</a>
    </div>
  </header>

  <div class="flex gap-2 mb-4" id="tabs">
    <button data-a="generate" class="tab active px-4 py-2 rounded-lg bg-slate-700 text-sm">生成</button>
    <button data-a="complete" class="tab px-4 py-2 rounded-lg bg-slate-700 text-sm">补全</button>
    <button data-a="refactor" class="tab px-4 py-2 rounded-lg bg-slate-700 text-sm">重构</button>
    <button data-a="explain" class="tab px-4 py-2 rounded-lg bg-slate-700 text-sm">解释</button>
  </div>

  <section class="glass rounded-2xl p-6 mb-6">
    <div class="flex items-center gap-3 mb-3">
      <label class="text-sm text-slate-400">语言</label>
      <select id="lang" class="bg-slate-900/70 border border-slate-700 rounded-lg p-2 text-sm">
        <option>Python</option><option>JavaScript</option><option>SQL</option>
      </select>
      <label class="flex items-center gap-2 text-xs text-slate-400 ml-auto">
        <input type="checkbox" id="runtest" /> 调用 MCP 工具「run_tests」
      </label>
    </div>
    <textarea id="code" rows="9" class="w-full bg-slate-900/70 border border-slate-700 rounded-lg p-3 text-sm font-mono" placeholder="生成模式：描述你想实现的功能；其余模式：粘贴代码">def 计算平均值(nums):
    total = 0
    for n in nums:
        total += n
    return total / len(nums)

class 数据处理:
    pass</textarea>
    <button id="runBtn" class="mt-3 px-5 py-2 rounded-lg bg-violet-500 hover:bg-violet-400 text-white text-sm font-medium">运行</button>
  </section>

  <section class="glass rounded-2xl p-6 hidden" id="result">
    <div class="flex items-center gap-2 mb-3 text-xs">
      <span class="px-2 py-1 rounded bg-violet-500/20 text-violet-300">Skill: <b id="skillUsed"></b></span>
      <span class="px-2 py-1 rounded bg-emerald-500/20 text-emerald-300" id="mcpUsed"></span>
    </div>
    <pre id="out" class="bg-slate-900/70 border border-slate-700 rounded-lg p-4 text-sm text-emerald-300 whitespace-pre-wrap"></pre>
  </section>
</div>

<script>
const API = "http://localhost:8011";
let action = "generate";
document.querySelectorAll("#tabs .tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); action=b.dataset.a;
  document.getElementById("code").placeholder = action==="generate" ? "描述你想实现的功能" : "粘贴代码";
});
function setStatus(){ fetch(API+"/api/code/health").then(r=>r.json()).then(d=>{
  document.getElementById("status").textContent = d.llm_enabled ? "● 真实模型" : "● 规则降级";
}).catch(()=> document.getElementById("status").textContent="● 未连接"); }
setStatus();

document.getElementById("runBtn").onclick = async ()=>{
  const isGen = action==="generate";
  const body = isGen ? { action, task:document.getElementById("code").value, language:document.getElementById("lang").value, run_test:document.getElementById("runtest").checked }
                     : { action, code:document.getElementById("code").value, language:document.getElementById("lang").value, run_test:document.getElementById("runtest").checked };
  const r = await fetch(API+"/api/code/process",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(x=>x.json());
  document.getElementById("result").classList.remove("hidden");
  document.getElementById("skillUsed").textContent = r.skill_used;
  const mcp = r.mcp_tool;
  document.getElementById("mcpUsed").textContent = mcp ? "MCP: "+mcp.content[0].text : "MCP: 未调用";
  document.getElementById("out").textContent = r.result;
};
</script>
</body>
</html>
