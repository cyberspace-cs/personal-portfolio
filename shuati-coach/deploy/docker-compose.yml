# 专属刷题教练 · 生产部署（教练后端 + Hermes Agent + nginx）
# 架构：公网只暴露 nginx(HTTPS) → 教练后端；Hermes 仅 Docker 内网，由后端代理
version: "3.8"

services:
  # ── 教练后端（FastAPI + SQLite） ──
  coach:
    build:
      context: ..          # 项目根，Dockerfile 在 server/ 下
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      - DB_DIR=/app/data     # 数据库持久化目录
      - STATIC_DIR=/app      # coach.html 所在静态根
    volumes:
      - ./data:/app/data     # 持久化 SQLite（含 WAL）
    expose:
      - "8000"
    mem_limit: 512m           # 2核2G 试水：限制内存，避免抖动拖垮整机
    restart: unless-stopped

  # ── Hermes Agent（OpenAI 兼容 API Server，仅内网） ──
  # 注意：绝不映射端口到宿主机；配置通过 volume 挂载，不写死进镜像
  hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    env_file: hermes.env
    volumes:
      - ./hermes.config.yaml:/root/.hermes/config.yaml:ro
      - ./hermes.env:/root/.hermes/.env:ro
    expose:
      - "8642"
    mem_limit: 768m           # 2核2G 试水：本机只跑网关，768m 足够；超过会重启而非 OOM 整机
    restart: unless-stopped

  # ── 反向代理 + HTTPS（唯一公网入口） ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - coach
    restart: unless-stopped
