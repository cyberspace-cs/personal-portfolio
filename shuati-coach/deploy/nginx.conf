# 专属刷题教练 · nginx 反代 + HTTPS
# 唯一公网入口：443 → coach 后端(:8000)。Hermes(:8642) 不在此暴露。

server {
    listen 80;
    server_name taoxie.vip;
    # 留给 certbot 验证
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name taoxie.vip;

    ssl_certificate     /etc/letsencrypt/live/taoxie.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taoxie.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # H5 平台 + 全部后端 API 都走 coach
    location / {
        proxy_pass http://coach:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
